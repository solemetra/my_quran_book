name: my_quran
description: Коран HD — удобное и быстрое чтение Корана без рекламы и интернета.
license: GPL-3.0-or-later

publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.2+3

environment:
    sdk: ">=3.5.0 <4.0.0"
    flutter: ">=3.24.0"

dependencies:
    collection: ^1.18.0
    dynamic_color: 1.7.0
    file_picker: ^8.1.7
    flutter:
        sdk: flutter
    flutter_localizations:
        sdk: flutter
    package_info_plus: ^9.0.0
    path_provider: ^2.1.5
    scrollable_positioned_list: ^0.3.8
    share_plus: ^12.0.1
    shared_preferences: ^2.5.3
    uuid: ^4.5.3
    wakelock_plus: ^1.4.0

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_launcher_icons: ^0.14.4
    very_good_analysis: ^6.0.0

# The following section is specific to Flutter.
flutter:
    uses-material-design: true

    assets:
        - assets/fonts/
        - assets/quran.json
        - assets/warsh.json
        - assets/kfgqpc_hafs.json
        - assets/search_index_hafs.json
        - assets/search_index_warsh.json

    fonts:
        - family: Scheherazade
          fonts:
            - asset: assets/fonts/subset-ScheherazadeNew.ttf
        - family: Rustam
          fonts:
            - asset: assets/fonts/rustam_quranR3HOQ.ttf
        - family: Hafs
          fonts:
            - asset: assets/fonts/HafsSmart.ttf
        - family: Warsh
          fonts:
            - asset: assets/fonts/uthmanic_warsh_v21.ttf
            
